# rumdl configuration. MD013 is off because prose lines wrap at the editor,
# not at a column count. MD025 is off because it reads the frontmatter title
# as the document title and demotes every body heading, which breaks the
# mdschema structure contracts. MD041 is off because change proposals open
# with frontmatter and no title field.
[global]
disable = ["MD013", "MD025", "MD041"]
# Adopted artifacts and idea snapshots carry digest-bound provenance
# sidecars, so their bytes stay exactly as adopted. Deployed provider trees are rune output.
exclude = [
    ".provenance",
    "docs/ideas",
    "tests/fixtures",
    ".claude",
    ".codex",
    ".gemini",
    ".opencode",
    "runes/core/rules/UseSimplifiedTechnicalEnglish.md",
    "runes/core/skills/RTK",
    "runes/core/skills/SimplifiedTechnicalEnglish",
    "runes/core/skills/VersionControl",
]

# Nested lists indent four spaces, the repository convention.
[MD007]
indent = 4

# Reference tags such as `*term* [TERM]` are shortcut references, and an
# undefined one is an error.
[MD052]
shortcut-syntax = true
# Keep-a-changelog headings, scanner templates, and a literal bot mention.
ignore = ["Unreleased", "REDACTED", "bot"]
