StylesPath = .vale/styles
MinAlertLevel = warning

# The STE style is generated from the Simplified Technical English rule
# source by scripts/generate-vale-style.py. Edit the source, regenerate,
# never edit the generated files. Fenced and inline code are never linted.
# Every rule is sentence-scoped, so YAML front matter is not linted.
# Blockquotes are prose: captured output belongs in a fence.
# STE advises and never fails a run: semicolons, contractions, and an
# overused word (gate, arm, knob, surface) warn, one vocabulary swap is
# a suggestion. Run `vale --minAlertLevel=suggestion` to see the swaps.

# Deslop flags machine-writing tells (JMill/deslop, MIT). The package is
# vendored under .vale/styles/Deslop so no run needs the network. To
# upgrade: download the release zip and replace the directory. Two rules
# are off because a Core rule replaces them: EmDashOveruse allows one
# dash where NoEmDash allows none, and NotJustScaffold misses the
# two-sentence "It is not X. It is Y." that NegativeParallelism catches.

# Core mirrors the deck's own rules: a named citation, the word
# directory, MUST in a requirement, no em dash, negative parallelism, an
# undefined jargon term, bold density, and AI vocabulary that the
# vendored packs miss. RequirementVerbs is on for specifications only.
# NoEmDash is the one error: it blocks a write in the lint hook.
# The plain-language rules (readback 2026-10-17) advise: an abbreviation
# with no explanation, a hedge, a stack of three nouns, and a passive
# that hides the actor report at suggestion; a sentence over 25 words and
# a command or path inside requirement prose warn. ai-tells.NounString
# draws the noun line at four and is off so one stack reports once.

# ai-tells is tbhb/vale-ai-tells v1.37.0 (2026-09-14, MIT), vendored under
# .vale/styles/ai-tells with its LICENSE. To upgrade: download the tagged
# release zip, replace the directory, update this note. Upstream releases
# about weekly, so the vendored copy tracks upstream, not the owner's fork
# (N4M3Z/vale-ai-tells): the fork holds additions until they merge
# upstream, and a rule upstream declines lives in Core here. The pack is on
# probation: every rule reports at suggestion, so it advises and never
# fails a check, while STE and Deslop keep their own levels. Rules that
# duplicate an STE or Deslop rule are off so one hit reports once.

[*.md]
BasedOnStyles = STE, Deslop, Core, ai-tells
ai-tells = suggestion
ai-tells.SemicolonUsage = NO
ai-tells.EmDashUsage = NO
ai-tells.HedgingPhrases = NO
ai-tells.FillerPhrases = NO
ai-tells.NounString = NO
Deslop.EmDashOveruse = NO
Deslop.NotJustScaffold = NO
Core.RequirementVerbs = NO
Core.BareCommandInProse = NO

[docs/**/spec.md]
Core.RequirementVerbs = YES

# Specifications name roles, never a program. BareCommandInProse reads a
# requirement file and the canonical specifications, where a command or a
# path in a code span belongs in the change's design table instead. The
# generated glossary pages name the ontology file and stay off.
[docs/changes/*/specs/**/*.md]
Core.BareCommandInProse = YES

[docs/specs/**/*.md]
Core.BareCommandInProse = YES

[docs/specs/glossary/**/*.md]
Core.BareCommandInProse = NO

# The foundation rules from plain-text-first-principles. DeckLinks reads
# every deck file outside the Obsidian domains and the idea snapshots.
# Nominalization reads headings and steps everywhere. UserValue and
# HarnessPlaceholder read instructions; a harness companion directory is
# where a harness placeholder belongs, so HarnessPlaceholder is off there.
[*.md]
Core.UserValue = NO
Core.HarnessPlaceholder = NO

[runes/**/*.md]
Core.UserValue = YES
Core.HarnessPlaceholder = YES

[runes/**/{claude,codex,gemini,opencode}/**/*.md]
Core.HarnessPlaceholder = NO

# Assembled output under a build directory is rune output, not a source.
[runes/**/build/**/*.md]
Core.UserValue = NO
Core.HarnessPlaceholder = NO

[docs/ideas/*.md]
Core.DeckLinks = NO

# Folder is the product's own word in these domains.
[{runes/obsidian,runes/proton,docs/changes/obsidian-placement-and-links,docs/changes/operate-proton-mail-privately}/**/*.md]
Core.Terminology = NO
Core.DeckLinks = NO

# Deliberate before/after prose samples: the errors are the teaching material.
[runes/core/skills/SimplifiedTechnicalEnglish/examples/*.md]
STE.Semicolons = NO
STE.Contractions = NO
Core.NoEmDash = NO

[runes/core/skills/SimplifiedTechnicalEnglish/references/*.md]
STE.Semicolons = NO
STE.Contractions = NO
Core.NoEmDash = NO
