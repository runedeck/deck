# Deslop (rule): a metaphor noun such as "gate" means nothing until the
# text says which check, file, or flag it stands for. A term is a link to
# its glossary page, so a link, a bold, or a backticked form anywhere in
# the text counts as the definition, and italics alone are emphasis. The
# nouns are the TERMS subset of OVERUSE, so one list serves this rule and
# STE.Overused*. Raw scope, because Vale strips the markers before any
# other scope. A hyphenated name such as review-lanes is a name, not
# the noun, in prose and in link text, and a link whose text ends in
# the noun (agentic review lane) defines it. The first pattern matches
# the stem alone, so a plural use counts as defined by its singular link.
