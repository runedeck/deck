# A numbered citation carries no meaning at the point of use, and
# assembly renumbers it when it combines or splits files (CORE-0009,
# Reference Citations). A reference link whose text is a number, such as
# [2020][TAG], is valid, and so is a term link [text][TAG], so a following
# bracket or parenthesis ends the match.
extends: existence
message: "Cite with a named reference link, not a number (CORE-0009)."
level: warning
nonword: true
raw:
  - '\[\d+\](?![(\[])'
