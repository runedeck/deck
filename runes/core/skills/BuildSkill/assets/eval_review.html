<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trigger eval set review</title>
<style>
  :root {
    --ink: #1d232e; --muted: #667085; --line: #dfe3ea; --bg: #f4f6f9;
    --card: #ffffff; --accent: #2d5bd1; --accent-ink: #ffffff;
    --yes: #178a4c; --yes-bg: #e7f6ed; --no: #b23a3a; --no-bg: #fbeaea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  header, main { max-width: 64rem; margin: 0 auto; padding: 1.5rem 1.25rem; }
  header { padding-bottom: 0; }
  h1 { margin: 0 0 .5rem; font-size: 1.5rem; }
  h2 { font-size: 1.1rem; margin: 1.75rem 0 .5rem; display: flex; align-items: center; gap: .5rem; }
  h2 .pill { font-size: .75rem; font-weight: 600; padding: .05rem .5rem; border-radius: 999px; }
  .yes h2 .pill { background: var(--yes-bg); color: var(--yes); }
  .no h2 .pill { background: var(--no-bg); color: var(--no); }
  .meta { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.25rem; }
  .meta p { margin: .25rem 0; overflow-wrap: anywhere; }
  .label { color: var(--muted); font-weight: 600; margin-right: .4rem; }
  .intro { color: var(--muted); margin: .75rem 0 0; }
  .toolbar { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; margin-top: 1rem; }
  .summary { color: var(--muted); margin-left: auto; }
  button {
    font: inherit; padding: .45rem .9rem; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.danger { color: var(--no); }
  .card {
    background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--line);
    border-radius: 10px; padding: .75rem .9rem; margin-bottom: .6rem;
    display: grid; grid-template-columns: 1fr auto; gap: .6rem; align-items: start;
  }
  .yes .card { border-left-color: var(--yes); }
  .no .card { border-left-color: var(--no); }
  textarea {
    width: 100%; min-height: 4.5rem; resize: vertical; font: inherit; padding: .5rem .6rem;
    border: 1px solid var(--line); border-radius: 6px; color: var(--ink);
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .actions { display: flex; flex-direction: column; gap: .4rem; min-width: 12rem; }
  .empty { color: var(--muted); font-style: italic; }
  .error { background: var(--no-bg); color: var(--no); padding: .75rem 1rem; border-radius: 8px; margin-top: 1rem; }
</style>
</head>
<body>
<header>
  <h1>Trigger eval set review</h1>
  <div class="meta">
    <p><span class="label">Skill</span><span id="skill-name"></span></p>
    <p><span class="label">Current description</span><span id="skill-description"></span></p>
    <p class="intro">Edit the queries below, move any between the two groups, delete the weak ones,
      and add new ones. When the set looks right, export it and hand the saved file back.</p>
  </div>
  <div class="toolbar">
    <button id="add-query" type="button">Add should-trigger query</button>
    <button id="export" type="button" class="primary">Export Eval Set</button>
    <span id="summary" class="summary"></span>
  </div>
  <div id="error" class="error" hidden></div>
</header>
<main>
  <section class="yes">
    <h2>Should trigger <span class="pill" id="count-yes"></span></h2>
    <div id="group-yes"></div>
  </section>
  <section class="no">
    <h2>Should not trigger <span class="pill" id="count-no"></span></h2>
    <div id="group-no"></div>
  </section>
</main>
<script>
(function () {
  "use strict";

  var EVAL_DATA_B64 = "__EVAL_DATA_BASE64__";
  var SKILL_NAME_B64 = "__SKILL_NAME_BASE64__";
  var SKILL_DESCRIPTION_B64 = "__SKILL_DESCRIPTION_BASE64__";

  function decodeUtf8Base64(encoded) {
    var binary = atob(encoded);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) {
      bytes[i] = binary.charCodeAt(i);
    }
    return new TextDecoder("utf-8").decode(bytes);
  }

  var items = [];
  var nextId = 1;

  function byId(id) { return document.getElementById(id); }

  function makeButton(text, className, onClick) {
    var button = document.createElement("button");
    button.type = "button";
    button.textContent = text;
    if (className) { button.className = className; }
    button.addEventListener("click", onClick);
    return button;
  }

  function buildCard(item) {
    var card = document.createElement("div");
    card.className = "card";

    var area = document.createElement("textarea");
    area.value = item.query;
    area.setAttribute("data-item-id", String(item.id));
    area.setAttribute("aria-label", "Query text");
    area.addEventListener("input", function () {
      item.query = area.value;
      updateSummary();
    });

    var actions = document.createElement("div");
    actions.className = "actions";
    actions.appendChild(makeButton(
      item.shouldTrigger ? "Move to should-not-trigger" : "Move to should-trigger",
      "",
      function () {
        item.shouldTrigger = !item.shouldTrigger;
        render(item.id);
      }
    ));
    actions.appendChild(makeButton("Delete", "danger", function () {
      items = items.filter(function (other) { return other !== item; });
      render(null);
    }));

    card.appendChild(area);
    card.appendChild(actions);
    return card;
  }

  function fillGroup(container, groupItems) {
    container.replaceChildren();
    if (groupItems.length === 0) {
      var note = document.createElement("p");
      note.className = "empty";
      note.textContent = "No queries in this group.";
      container.appendChild(note);
      return;
    }
    groupItems.forEach(function (item) {
      container.appendChild(buildCard(item));
    });
  }

  function updateSummary() {
    var yes = items.filter(function (item) { return item.shouldTrigger; }).length;
    var no = items.length - yes;
    byId("summary").textContent =
      items.length + " queries: " + yes + " should trigger, " + no + " should not trigger";
    byId("count-yes").textContent = String(yes);
    byId("count-no").textContent = String(no);
  }

  function render(focusId) {
    fillGroup(byId("group-yes"), items.filter(function (item) { return item.shouldTrigger; }));
    fillGroup(byId("group-no"), items.filter(function (item) { return !item.shouldTrigger; }));
    updateSummary();
    if (focusId !== null && focusId !== undefined) {
      var area = document.querySelector('textarea[data-item-id="' + focusId + '"]');
      if (area) { area.focus(); }
    }
  }

  function addQuery() {
    var item = { id: nextId++, query: "", shouldTrigger: true };
    items.push(item);
    render(item.id);
  }

  function exportEvalSet() {
    var exported = [];
    items.filter(function (item) { return item.shouldTrigger; })
      .concat(items.filter(function (item) { return !item.shouldTrigger; }))
      .forEach(function (item) {
        var text = item.query.trim();
        if (text.length > 0) {
          exported.push({ query: text, should_trigger: item.shouldTrigger });
        }
      });
    var blob = new Blob([JSON.stringify(exported, null, 2) + "\n"], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url;
    link.download = "eval_set.json";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function showError(message) {
    var box = byId("error");
    box.textContent = message;
    box.hidden = false;
  }

  function load() {
    var data;
    try {
      byId("skill-name").textContent = decodeUtf8Base64(SKILL_NAME_B64);
      byId("skill-description").textContent = decodeUtf8Base64(SKILL_DESCRIPTION_B64);
      data = JSON.parse(decodeUtf8Base64(EVAL_DATA_B64));
    } catch (err) {
      showError("The embedded data could not be decoded: " + err.message);
      data = [];
    }
    if (!Array.isArray(data)) {
      showError("The embedded eval data is not a JSON array.");
      data = [];
    }
    items = data.map(function (row) {
      return {
        id: nextId++,
        query: row && typeof row.query === "string" ? row.query : "",
        shouldTrigger: Boolean(row && row.should_trigger)
      };
    });
    byId("add-query").addEventListener("click", addQuery);
    byId("export").addEventListener("click", exportEvalSet);
    render(null);
  }

  load();
})();
</script>
</body>
</html>
