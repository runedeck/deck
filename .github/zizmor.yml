# zizmor baseline registry (DECK-0010). Every entry below is declared
# debt from the first audit of the workflow fleet, recorded so the gate
# can block new findings while task 2.14 (declared-world change) owns
# the triage. Remove an entry when its workflow is repaired; never add
# one without a reason beside it.
rules:
    dangerous-triggers:
        # pull_request_target is the deliberate seer design: the review
        # lanes need base-repository secrets on fork pull requests.
        ignore:
            - attestations.yaml
            - autofix-comment.yaml
            - pr-lint.yaml
            - review-cascade.yaml
            - review-correctness.yaml
            - review-cursor.yaml
            - thread-resolver.yaml
    unpinned-uses:
        # runedeck/* first-party references are exempt from SHA pinning
        # by the action-pinning check in quality.yaml; zizmor cannot
        # express that policy, so the files carry ignores.
        ignore:
            - autofix-comment.yaml
            - autofix-suggest.yaml
            - congrats.yaml
            - issue-dedup.yaml
            - review-cascade.yaml
            - review-correctness.yaml
            - review-cursor.yaml
            - thread-resolver.yaml
    excessive-permissions:
        # Permission tightening is the 2.14 triage work.
        ignore:
            - pr-lint.yaml
            - review-cascade.yaml
            - review-correctness.yaml
    github-app:
        # The runeseer app token mints are the acceptance design.
        ignore:
            - review-correctness.yaml
            - template-update.yaml
    artipacked:
        # persist-credentials hardening is the 2.14 triage work.
        ignore:
            - attestations.yaml
            - secret-scan.yaml
    template-injection:
        # The expansion sites are the 2.14 triage work.
        ignore:
            - review-correctness.yaml
