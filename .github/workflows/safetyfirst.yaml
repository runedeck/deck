name: Skill portability contract

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    contract:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
            - name: Check out the architecture dependency
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  repository: runedeck/cli
                  ref: 7412b6acf037420129c8ac45759d4c75af0e96af
                  path: .validation-cli
                  persist-credentials: false
            - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
            - name: Build the pinned Rune candidate
              run: cargo build --manifest-path .validation-cli/Cargo.toml
            - name: Check every skill source layer
              run: .validation-cli/target/debug/rune validate --skill-layers --source .
            - name: Check portable and Claude bundles
              env:
                  RUNE_TEST_BINARY: ${{ github.workspace }}/.validation-cli/target/debug/rune
              run: |
                  python3 - <<'PYTEST'
                  import unittest
                  suite = unittest.TestSuite()
                  for pattern, expected in (("test_safetyfirst.py", 23), ("test_skill_portability.py", 9)):
                      selected = unittest.defaultTestLoader.discover("tests", pattern=pattern)
                      if selected.countTestCases() != expected:
                          raise SystemExit(f"{pattern}: expected {expected} tests, got {selected.countTestCases()}")
                      suite.addTests(selected)
                  result = unittest.TextTestRunner(verbosity=2).run(suite)
                  if not result.wasSuccessful() or result.skipped or result.testsRun != 32:
                      raise SystemExit("Required content tests failed, skipped, or did not execute")
                  PYTEST
