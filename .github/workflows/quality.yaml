name: Quality

# Two runs, two facts. The push run proves the head commit: it is the
# green-head signal Draft Open and the review controller re-enter on, and
# its log is the receipt `rune sign submit` carries. The merge_group run
# proves the merge the queue is about to make, and the ruleset requires it.
# There is no pull_request run: GitHub builds that merge commit once and
# never rebuilds it when the base moves, so its verdict is about a tree
# nobody can inspect (runedeck/cli #67, 2026-09-21). The queue's temporary
# branches are proven by the merge_group run alone.
on:
    push:
        branches-ignore:
            - "gh-readonly-queue/**"
    merge_group:
        types: [checks_requested]

concurrency:
    group: quality-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: read

jobs:
    quality:
        runs-on: ubuntu-latest
        # The pinned rune build takes several minutes on the runner.
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0
                  # The prek hooks execute code from the checked-out tree, which
                  # must never find a usable token in the git config.
                  persist-credentials: false

            - name: Cloud environment installer tests
              run: python3 scripts/test_cursor_install.py

            - name: Test model attribution
              run: python3 -m unittest discover -s tests -p 'test_auth*.py' -v

            - name: Test provenance digests
              run: python3 -m unittest discover -s scripts -p 'test_check_provenance.py' -v

            - name: Test exposure detector
              run: python3 -m unittest discover -s tests -p 'test_exposure_scan.py' -v

            - name: Test the provisioning checks
              run: python3 -m unittest discover -s tests -p 'test_check_provisioning_*.py' -v

            - name: Test the comparison record generator
              run: python3 -m unittest discover -s tests -p 'test_record_comparison.py' -v

            - name: Install JJ for push gate tests
              env:
                  JJ_VERSION: "0.45.1"
                  JJ_SHA256: "f35438350b5d61963aac5dd74ede510b31d6b9690769d1a6268cf058cc825f72"
              run: |
                  scratch=$(mktemp -d)
                  curl -fsSL -o "$scratch/jj.tar.gz" "https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
                  printf '%s  %s\n' "$JJ_SHA256" "$scratch/jj.tar.gz" | sha256sum --check
                  tar -xzf "$scratch/jj.tar.gz" -C "$scratch" ./jj
                  sudo install "$scratch/jj" /usr/local/bin/jj
                  jj --version

            - name: Test JJ push gate
              run: python3 -m unittest discover -s tests -p 'test_jj_push.py' -v

            # Third-party actions must be pinned to a full commit SHA;
            # first-party paths (./) and runedeck/* refs are exempt.
            - name: Action pinning
              run: |
                  # Comments are stripped before the SHA test so trailing
                  # text cannot fake a pin.
                  violations=$(grep -RnE '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*["'\'']?[^./[:space:]"'\'']' .github/workflows 2>/dev/null \
                      | sed 's/[[:space:]]#.*$//' \
                      | grep -vE 'uses:[[:space:]]*["'\'']?(\./|runedeck/)' \
                      | grep -vE '@[0-9a-f]{40}["'\'']?$' || true)
                  if [ -n "$violations" ]; then
                      echo "Unpinned third-party actions:"
                      printf '%s\n' "$violations"
                      exit 1
                  fi
                  echo "All third-party actions pinned."

            - name: Test JJ push environment isolation
              run: python3 scripts/test_jj_push_environment.py

            # The pull request under check: on merge_group its number is in
            # the queue branch name, on push it is the open pull request whose
            # head is this branch. A push with no pull request yet (the first
            # push, before Draft Open) and a push to the default branch have
            # no body to attest.
            - name: Release notes attestation
              if: github.event_name == 'merge_group' || github.ref_name != github.event.repository.default_branch
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  OWNER: ${{ github.repository_owner }}
                  BRANCH: ${{ github.ref_name }}
                  QUEUE_REF: ${{ github.event.merge_group.head_ref }}
              run: |
                  set -o pipefail
                  if [ -n "$QUEUE_REF" ]; then
                      number=$(printf '%s\n' "$QUEUE_REF" | sed -nE 's#^refs/heads/gh-readonly-queue/[^/]+/pr-([0-9]+)-.*$#\1#p')
                      [ -n "$number" ] || { echo "cannot read the pull request number from $QUEUE_REF"; exit 1; }
                  else
                      number=$(gh api --paginate "repos/$REPOSITORY/pulls?state=open&head=$OWNER:$BRANCH&per_page=100" \
                          --jq '[.[].number]' | jq -s -r 'add // [] | first // ""') \
                          || { echo "could not read the pull requests for $BRANCH (API or permission failure)"; exit 1; }
                      if [ -z "$number" ]; then
                          echo "no open pull request for $BRANCH yet; nothing to attest."
                          exit 0
                      fi
                  fi
                  # The fetch and the parse fail separately: an API or
                  # permission fault must not read as a missing section.
                  body=$(gh api "repos/$REPOSITORY/pulls/$number" --jq '.body // ""') \
                      || { echo "could not read the pull request body (API or permission failure)"; exit 1; }
                  if printf '%s\n' "$body" \
                      | awk '/^## Release Notes[[:space:]]*$/{in_section=1; next} /^## /{in_section=0} in_section && /^([-*+]|[0-9]+[.)]) /{found=1} END{exit !found}'; then
                      echo "Release Notes section present."
                  else
                      echo "The pull request body needs a '## Release Notes' section with at least one entry ('- N/A' for non-user-facing work)."
                      exit 1
                  fi

            # Local hooks, generated CI, and template updates all consume the
            # same reviewed tool versions and archive digests.
            # The shared installer ends by running scripts/install-tools.local,
            # which installs the deck-only validators (rudof, openspec) the
            # REQUIRE_GATES hooks demand.
            - name: Install tools
              run: bash scripts/install-tools

            # The ontology-graph hook runs `rune graph export` under
            # REQUIRE_GATES. The runner has cargo; the cli is pinned by
            # commit, the same way the contract job pins its candidate.
            # An in-tree checkout would land under the all-files hooks.
            - name: Install the pinned rune
              env:
                  RUNE_CLI_REV: eb6cec352ea6f0f60893d9ec6555348190853001
              run: |
                  cargo install --quiet --git https://github.com/runedeck/cli --rev "$RUNE_CLI_REV" rune-cli
                  rune --version

            # The selection test installs a scratch deck with the rune above,
            # so it comes after it and fails rather than skips without one.
            - name: Test that the default deployment leaves the provisioning module out
              env:
                  REQUIRE_GATES: "1"
              run: python3 -m unittest discover -s tests -p 'test_provisioning_default_selection.py' -v

            # The fixture tests run the Vale rules and the check scripts the
            # installer above provides, so they come after it.
            - name: Test the foundation checks and Core Vale rules against their fixtures
              env:
                  REQUIRE_GATES: "1"
              run: python3 -m unittest tests.test_check_scripts -v

            # Select the event range once so both prek stages inspect the same
            # change: the merge group from its base, a push from its previous
            # tip. The first push of a new branch carries no before commit,
            # and a rewritten branch carries one that no ref reaches any more.
            # Both start at the branch's merge base with main. Without it, the
            # stages inspected every file, and a hook that needs a desktop tool,
            # such as the idea snapshot check, failed on every such push.
            # Inspect all files only when no base commit exists.
            - name: Select check range
              id: check-range
              env:
                  MERGE_BASE: ${{ github.event.merge_group.base_sha }}
                  MERGE_HEAD: ${{ github.event.merge_group.head_sha }}
                  PUSH_BASE: ${{ github.event.before }}
                  PUSH_HEAD: ${{ github.sha }}
              run: |
                  from=""
                  to="$PUSH_HEAD"
                  if [ -n "$MERGE_BASE" ]; then
                      from="$MERGE_BASE"
                      to="$MERGE_HEAD"
                  elif [ -n "$PUSH_BASE" ] && ! printf '%s' "$PUSH_BASE" | grep -q '^0*$'; then
                      from="$PUSH_BASE"
                  fi
                  if [ "$GITHUB_REF" != "refs/heads/main" ] \
                      && { [ -z "$from" ] || ! git cat-file -e "$from^{commit}" 2>/dev/null; }; then
                      from=$(git merge-base origin/main "$to" 2>/dev/null || true)
                  fi

                  if [ -n "$from" ] && git cat-file -e "$from^{commit}" 2>/dev/null; then
                      echo "usable=true" >> "$GITHUB_OUTPUT"
                      echo "from=$from" >> "$GITHUB_OUTPUT"
                  else
                      echo "usable=false" >> "$GITHUB_OUTPUT"
                  fi
                  echo "to=$to" >> "$GITHUB_OUTPUT"

            # The prek CLI is called directly: the wrapper action logs at
            # TRACE level and buries the failing hook's output. REQUIRE_GATES
            # turns a missing linter into a failure instead of a skip.
            - name: Commit-stage checks
              env:
                  REQUIRE_GATES: "1"
                  RANGE_USABLE: ${{ steps.check-range.outputs.usable }}
                  FROM_REF: ${{ steps.check-range.outputs.from }}
                  TO_REF: ${{ steps.check-range.outputs.to }}
              run: |
                  if [ "$RANGE_USABLE" = "true" ]; then
                      prek run --from-ref "$FROM_REF" --to-ref "$TO_REF"
                  else
                      prek run --all-files
                  fi

            # Scan the same range at the pre-push stage. Without a usable base,
            # gitleaks scans the target history and other hooks inspect all files.
            - name: Pre-push-stage checks
              env:
                  RANGE_USABLE: ${{ steps.check-range.outputs.usable }}
                  FROM_REF: ${{ steps.check-range.outputs.from }}
                  TO_REF: ${{ steps.check-range.outputs.to }}
              run: |
                  if [ "$RANGE_USABLE" = "true" ]; then
                      prek run --stage pre-push --from-ref "$FROM_REF" --to-ref "$TO_REF"
                  else
                      GITLEAKS_PUSH_TO_REF="$TO_REF" prek run --stage pre-push --all-files
                  fi
