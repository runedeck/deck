name: Quality

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: quality-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: read

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0
                  # The prek hooks execute code from the checked-out tree, which
                  # must never find a usable token in the git config.
                  persist-credentials: false

            - name: Cloud environment installer tests
              run: python3 scripts/test_cursor_install.py

            - name: Test model attribution
              run: python3 -m unittest discover -s tests -p 'test_auth*.py' -v

            - name: Test provenance digests
              run: python3 -m unittest discover -s scripts -p 'test_check_provenance.py' -v

            - name: Install JJ for push gate tests
              env:
                  JJ_VERSION: "0.45.1"
                  JJ_SHA256: "f35438350b5d61963aac5dd74ede510b31d6b9690769d1a6268cf058cc825f72"
              run: |
                  scratch=$(mktemp -d)
                  curl -fsSL -o "$scratch/jj.tar.gz" "https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
                  printf '%s  %s\n' "$JJ_SHA256" "$scratch/jj.tar.gz" | sha256sum --check
                  tar -xzf "$scratch/jj.tar.gz" -C "$scratch" ./jj
                  sudo install "$scratch/jj" /usr/local/bin/jj
                  jj --version

            - name: Test JJ push gate
              run: python3 -m unittest discover -s tests -p 'test_jj_push.py' -v

            # Third-party actions must be pinned to a full commit SHA;
            # first-party paths (./) and runedeck/* refs are exempt.
            - name: Action pinning
              run: |
                  # Comments are stripped before the SHA test so trailing
                  # text cannot fake a pin.
                  violations=$(grep -RnE '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*["'\'']?[^./[:space:]"'\'']' .github/workflows 2>/dev/null \
                      | sed 's/[[:space:]]#.*$//' \
                      | grep -vE 'uses:[[:space:]]*["'\'']?(\./|runedeck/)' \
                      | grep -vE '@[0-9a-f]{40}["'\'']?$' || true)
                  if [ -n "$violations" ]; then
                      echo "Unpinned third-party actions:"
                      printf '%s\n' "$violations"
                      exit 1
                  fi
                  echo "All third-party actions pinned."

            - name: Release notes attestation
              if: github.event_name == 'pull_request'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  # The fetch and the parse fail separately: an API or
                  # permission fault must not read as a missing section.
                  body=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq '.body // ""') \
                      || { echo "could not read the pull request body (API or permission failure)"; exit 1; }
                  if printf '%s\n' "$body" \
                      | awk '/^## Release Notes[[:space:]]*$/{in_section=1; next} /^## /{in_section=0} in_section && /^([-*+]|[0-9]+[.)]) /{found=1} END{exit !found}'; then
                      echo "Release Notes section present."
                  else
                      echo "The pull request body needs a '## Release Notes' section with at least one entry ('- N/A' for non-user-facing work)."
                      exit 1
                  fi

            # Local hooks, generated CI, and template updates all consume the
            # same reviewed tool versions and archive digests.
            - name: Install tools
              run: bash scripts/install-tools

            # Select the event range once so both prek stages inspect the same
            # change. Inspect all files only when no base commit exists.
            - name: Select check range
              id: check-range
              env:
                  PR_BASE: ${{ github.event.pull_request.base.sha }}
                  PR_HEAD: ${{ github.event.pull_request.head.sha }}
                  PUSH_BASE: ${{ github.event.before }}
                  PUSH_HEAD: ${{ github.sha }}
              run: |
                  from=""
                  to="$PUSH_HEAD"
                  if [ -n "$PR_BASE" ]; then
                      from="$PR_BASE"
                      to="$PR_HEAD"
                  elif [ -n "$PUSH_BASE" ] && ! printf '%s' "$PUSH_BASE" | grep -q '^0*$'; then
                      from="$PUSH_BASE"
                  fi

                  if [ -n "$from" ] && git cat-file -e "$from^{commit}" 2>/dev/null; then
                      echo "usable=true" >> "$GITHUB_OUTPUT"
                      echo "from=$from" >> "$GITHUB_OUTPUT"
                  else
                      echo "usable=false" >> "$GITHUB_OUTPUT"
                  fi
                  echo "to=$to" >> "$GITHUB_OUTPUT"

            # The prek CLI is called directly: the wrapper action logs at
            # TRACE level and buries the failing hook's output. REQUIRE_GATES
            # turns a missing linter into a failure instead of a skip.
            - name: Commit-stage checks
              env:
                  REQUIRE_GATES: "1"
                  RANGE_USABLE: ${{ steps.check-range.outputs.usable }}
                  FROM_REF: ${{ steps.check-range.outputs.from }}
                  TO_REF: ${{ steps.check-range.outputs.to }}
              run: |
                  if [ "$RANGE_USABLE" = "true" ]; then
                      prek run --from-ref "$FROM_REF" --to-ref "$TO_REF"
                  else
                      prek run --all-files
                  fi

            # Scan the same range at the pre-push stage. Without a usable base,
            # gitleaks scans the target history and other hooks inspect all files.
            - name: Pre-push-stage checks
              env:
                  RANGE_USABLE: ${{ steps.check-range.outputs.usable }}
                  FROM_REF: ${{ steps.check-range.outputs.from }}
                  TO_REF: ${{ steps.check-range.outputs.to }}
              run: |
                  if [ "$RANGE_USABLE" = "true" ]; then
                      prek run --stage pre-push --from-ref "$FROM_REF" --to-ref "$TO_REF"
                  else
                      GITLEAKS_PUSH_TO_REF="$TO_REF" prek run --stage pre-push --all-files
                  fi
