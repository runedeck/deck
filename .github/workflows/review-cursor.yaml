name: Review Cursor

# Thin caller: the cursor summon lives in runedeck/seer. pull_request_target,
# deliberately: the lane is API-only and checks out nothing, and fork pull
# requests need the base-context secrets. Never add a head checkout here or
# in the body.
on:
    pull_request_target:
        types: [labeled]

permissions:
    contents: read
    pull-requests: read
    issues: write

# The label name is part of the group. Every labeled event starts a run,
# and GitHub keeps one pending run per group: with a shared group, an
# unrelated label event evicts a queued review:cursor summon. Per-label
# groups keep unrelated events out of the summon's queue.
concurrency:
    group: review-cursor-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
    cancel-in-progress: false

jobs:
    summon:
        if: github.event.action == 'labeled' && github.event.label.name == 'review:cursor'
        uses: runedeck/seer/.github/workflows/review-cursor.yaml@main
        secrets:
            RUNEWRIGHT_APP_ID: ${{ secrets.RUNEWRIGHT_APP_ID }}
            RUNEWRIGHT_APP_KEY: ${{ secrets.RUNEWRIGHT_APP_KEY }}
            # Cursor ignores bot-authored review comments; the summon posts
            # with this owner-minted token instead.
            RUNEWRIGHT_GITHUB_TOKEN: ${{ secrets.RUNEWRIGHT_GITHUB_TOKEN }}
