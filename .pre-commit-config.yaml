# One universal config for every scaffolded repository: each hook gates on
# the file types present in the change, so hooks for absent languages never
# fire and language templates carry no lint config of their own.
# Durable provenance sidecars stay byte-stable under every hook.
repos:
    - repo: builtin
      hooks:
          # Source-level sidecars under .provenance/ are digest-bound evidence:
          # an auto-fixing hook that rewrites one destroys what it touches.
          # Temporary block-review ledgers must never be committed here.
          - id: trailing-whitespace
            exclude: '(^|/)\.provenance/'
          - id: check-yaml
            exclude: ^templates/
          - id: check-json

    - repo: local
      hooks:
          # A labeled begin or end marker is never legitimate text, so each
          # blocks alone and a partially resolved conflict still fails; only
          # a bare ======= is setext-ambiguous and passes.
          - id: check-conflict-markers
            name: conflict markers
            entry: sh -c 'status=0; for file in "$@"; do if grep -n -E "^(<<<<<<< |>>>>>>> )" "$file"; then status=1; fi; done; exit "$status"' --
            language: system
            types: [text]

          - id: check-reject-files
            name: reject files
            entry: sh -c 'rejects=$(git ls-files --cached --others --exclude-standard -- "*.rej"); [ -z "$rejects" ] || { printf "%s\n" "$rejects"; exit 1; }'
            language: system
            pass_filenames: false

          - id: check-review-ledgers
            name: temporary review ledgers are not tracked
            entry: sh -c 'ledgers=$(git ls-files -- ":(glob)**/.provenance/review.yaml" ":(glob)**/.provenance/*.review.yaml"); [ -z "$ledgers" ] || { printf "temporary adoption state must not be committed:\n%s\n" "$ledgers"; exit 1; }'
            language: system
            pass_filenames: false

          - id: shellcheck
            name: shellcheck
            entry: shellcheck -S warning
            language: system
            types: [shell]

          - id: ruff
            name: ruff check
            entry: ruff check .
            language: system
            pass_filenames: false
            types: [python]

          - id: cargo-fmt
            name: cargo fmt
            entry: cargo fmt --check
            language: system
            pass_filenames: false
            types: [rust]

          - id: cargo-clippy
            name: cargo clippy
            entry: cargo clippy --all-targets --all-features -- -D warnings
            language: system
            pass_filenames: false
            types: [rust]

          - id: tsc
            name: tsc --noEmit
            entry: npx tsc --noEmit
            language: system
            pass_filenames: false
            types: [ts]

          - id: gitleaks
            name: gitleaks (staged)
            entry: gitleaks git --staged --pre-commit --no-banner
            language: system
            pass_filenames: false
            stages: [pre-commit]

          - id: rune-validate
            name: rune validate
            entry: sh -c 'if command -v rune >/dev/null 2>&1 && { [ -f module.yaml ] || [ -f deck.yaml ] || [ -f .rune ]; }; then rune validate; fi'
            language: system
            pass_filenames: false

          - id: mdschema-skills
            name: mdschema skill entrypoints
            entry: sh -c 'if command -v mdschema >/dev/null 2>&1; then for skill in runes/*/skills/*/SKILL.md; do [ -f "$skill" ] || continue; dir=${skill%/SKILL.md}; schema="$dir/.mdschema"; [ -f "$schema" ] || schema="${dir%/*}/.mdschema"; [ -f "$schema" ] || { echo "no .mdschema for $skill"; exit 1; }; mdschema check "$skill" --schema "$schema" || exit 1; done; fi'
            language: system
            pass_filenames: false

          - id: stable-shell-schemas
            name: stable shell schema copies
            entry: make validate-schemas
            language: system
            pass_filenames: false

          # Prose and hygiene gates (DECK-0010). Each hook skips when its
          # binary is absent, so a scaffolded repository stays installable
          # before the tools arrive.
          - id: rumdl
            name: rumdl markdown lint
            entry: sh -c 'if command -v rumdl >/dev/null 2>&1; then rumdl check "$@"; elif [ -n "${REQUIRE_GATES:-}" ]; then echo "REQUIRE_GATES set and rumdl is absent"; exit 1; fi' --
            language: system
            types: [markdown]
            exclude: '(^|/)\.provenance/|^templates/'

          - id: typos
            name: typos spelling
            entry: sh -c 'if command -v typos >/dev/null 2>&1; then typos --force-exclude "$@"; elif [ -n "${REQUIRE_GATES:-}" ]; then echo "REQUIRE_GATES set and typos is absent"; exit 1; fi' --
            language: system
            types: [text]
            exclude: '(^|/)\.provenance/'

          - id: vale
            name: vale prose style
            entry: sh -c 'if command -v vale >/dev/null 2>&1; then vale --no-wrap "$@"; elif [ -n "${REQUIRE_GATES:-}" ]; then echo "REQUIRE_GATES set and vale is absent"; exit 1; fi' --
            language: system
            types: [markdown]
            exclude: '(^|/)\.provenance/|^templates/|^runes/core/rules/Deslop\.md$'

          - id: lychee
            name: lychee link check (offline)
            entry: sh -c 'if command -v lychee >/dev/null 2>&1; then lychee --offline --include-fragments --no-progress "$@"; elif [ -n "${REQUIRE_GATES:-}" ]; then echo "REQUIRE_GATES set and lychee is absent"; exit 1; fi' --
            language: system
            types: [markdown]
            exclude: '(^|/)\.provenance/|^templates/'

          # actionlint and zizmor audit only the changed workflow files, so
          # one workflow's edit is not blocked by another's recorded debt.
          # Task 2.14 owns the full-baseline triage.
          - id: actionlint
            name: actionlint
            entry: sh -c 'if command -v actionlint >/dev/null 2>&1; then actionlint "$@"; elif [ -n "${REQUIRE_GATES:-}" ]; then echo "REQUIRE_GATES set and actionlint is absent"; exit 1; fi' --
            language: system
            files: ^\.github/workflows/.*\.ya?ml$

          - id: zizmor
            name: zizmor workflow audit
            entry: sh -c 'if command -v zizmor >/dev/null 2>&1; then if [ -f .github/zizmor.yml ]; then zizmor --config .github/zizmor.yml "$@"; else zizmor "$@"; fi; elif [ -n "${REQUIRE_GATES:-}" ]; then echo "REQUIRE_GATES set and zizmor is absent"; exit 1; fi' --
            language: system
            files: ^\.github/workflows/.*\.ya?ml$

          # The declared world is hand-edited Turtle. This hook proves the
          # ontology parses and asserts the smoke fixture's exact findings,
          # so deleting or breaking a shape fails the hook.
          - id: ontology-syntax
            name: ontology syntax and shapes smoke test
            entry: sh -c 'if command -v rudof >/dev/null 2>&1; then rudof data ontology/rune.ttl >/dev/null || exit 1; r=$(rudof shacl-validate -s ontology/shapes.ttl -r turtle ontology/smoke/instances.ttl 2>/dev/null); v=$(printf "%s" "$r" | grep -c "sh:Violation"); w=$(printf "%s" "$r" | grep -c "sh:Warning"); [ "$v" -eq 4 ] && [ "$w" -eq 2 ] || { echo "shapes smoke test expected 4 Violations and 2 Warnings, got $v and $w"; exit 1; }; elif [ -n "${REQUIRE_GATES:-}" ]; then echo "REQUIRE_GATES set and rudof is absent"; exit 1; fi'
            language: system
            pass_filenames: false
            files: ^ontology/.*\.ttl$

          - id: openspec-validate
            name: openspec validate (strict)
            entry: sh -c 'if command -v openspec >/dev/null 2>&1 && [ -d docs/changes ]; then openspec validate --all --strict --no-interactive; elif [ -n "${REQUIRE_GATES:-}" ]; then echo "REQUIRE_GATES set and openspec is absent"; exit 1; fi'
            language: system
            pass_filenames: false
            files: ^docs/(changes|specs)/

          - id: cargo-test
            name: cargo test
            entry: cargo test --all-features
            language: system
            pass_filenames: false
            types: [rust]
            stages: [pre-push]

          - id: semgrep
            name: semgrep OWASP
            entry: semgrep scan --config=p/owasp-top-ten --metrics=off --quiet --disable-version-check --error .
            language: system
            pass_filenames: false
            stages: [pre-push]

          - id: gitleaks-range
            name: gitleaks (push range)
            entry: sh -c 'if [ -n "${PRE_COMMIT_FROM_REF:-}" ]; then gitleaks git --no-banner --log-opts "${PRE_COMMIT_FROM_REF}..${PRE_COMMIT_TO_REF:-HEAD}"; elif [ -n "${GITLEAKS_PUSH_TO_REF:-}" ]; then gitleaks git --no-banner --log-opts "$GITLEAKS_PUSH_TO_REF"; else bash .githooks/pre-commit --scan-only; fi'
            language: system
            pass_filenames: false
            stages: [pre-push]

          # The same rules as the ci/authorship workflow, applied before the
          # push so a bad identity fails as a local amend, not a CI rewrite.
          # A rune edit must carry its refreshed provenance subject digest,
          # so a stale sidecar fails before the weekly audit finds it.
          - id: check-provenance
            name: provenance digests
            entry: python3 scripts/check-provenance
            language: system
            files: ^runes/
          - id: check-authorship
            name: authorship (push range)
            entry: bash scripts/check-authorship
            language: system
            pass_filenames: false
            stages: [pre-push]
