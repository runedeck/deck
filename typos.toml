# typos configuration. KEYS holds base64 key material. Sidecars and
# third-party notices are not this repository's prose.
[files]
extend-exclude = [
    "KEYS",
    ".provenance",
    ".claude",
    ".codex",
    ".gemini",
    ".opencode",
    "**/THIRD_PARTY_NOTICES.md",
    "runes/core/skills/SimplifiedTechnicalEnglish/scripts",
    # Vendored third-party style package with regex word stems.
    ".vale/styles/Deslop",
]

[default]
# Mermaid node identifiers such as BA in fenced diagrams.
extend-ignore-re = ["[A-Z]{2} ?-->", "--> ?[A-Z]{2}", "[A-Z]{2}\\[", "\"fpr\""]
