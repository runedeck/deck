# typos configuration. KEYS holds base64 key material. Sidecars and
# third-party notices are not this repository's prose.
[files]
extend-exclude = [
    # The judgment proof contains deliberate typos the scenes must catch.
    "docs/proofs/*-judgment/**",
    "*.asc",
    ".provenance",
    ".claude",
    ".codex",
    ".gemini",
    ".opencode",
    "**/THIRD_PARTY_NOTICES.md",
    "runes/core/skills/SimplifiedTechnicalEnglish/scripts",
    # Vendored third-party style packages with regex word stems.
    ".vale/styles/Deslop",
    ".vale/styles/ai-tells",
]

[default]
# Mermaid node identifiers such as BA in fenced diagrams.
extend-ignore-re = ["[A-Z]{2} ?-->", "--> ?[A-Z]{2}", "[A-Z]{2}\\[", "\\bfpr\\b"]

[default.extend-words]
# Debian GObject introspection packages, such as gir1.2-atspi-2.0.
gir = "gir"
